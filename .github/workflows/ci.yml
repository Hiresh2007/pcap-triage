name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Smoke test on generated demo capture
        run: |
          python scripts/make_demo_pcap.py samples/demo_scan.pcap
          pcap-triage analyze samples/demo_scan.pcap
          pcap-triage analyze samples/demo_scan.pcap --format json --fail-on-findings && exit 1 || test $? -eq 1
