[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap-triage"
version = "0.1.0"
description = "Offline PCAP triage: flow summaries and explainable detections for SOC analysis."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Hiresh Yadav" }]
dependencies = ["scapy>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pcap-triage = "pcap_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
